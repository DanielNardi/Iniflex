# ---------------------------------------------------------------
# Configuração MongoDB
# Para rodar localmente: apontar para localhost
# Para Docker: sobrescrito via variável de ambiente SPRING_DATA_MONGODB_URI
# ---------------------------------------------------------------
spring.application.name=industria
spring.data.mongodb.uri=mongodb://admin:admin123@localhost:27018/industria?authSource=admin

# Porta do servidor
server.port=8080

# Encoding UTF-8 nas respostas HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Nível de log
logging.level.com.industria=INFO
logging.level.org.springframework.data.mongodb=WARN
